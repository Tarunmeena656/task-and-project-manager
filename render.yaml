services:
  - type: web
    name: task-manager
    runtime: node
    plan: free
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && npm ci --prefix backend && npm run build --prefix backend
    startCommand: cd backend && npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: STATIC_DIR
        value: ../frontend/dist/frontend/browser

databases:
  - name: task-manager-db
    plan: free
    databaseName: taskmanager
    user: taskmanager
